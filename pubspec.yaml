name: dr_folha_vida
description: "Dr. FolhaVida - assistente de jardinagem com IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:    # seletores de data/hora em pt-BR
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Fase 1: base do app (MVC) ---
  provider: ^6.1.2          # injeta e observa os Controllers (ChangeNotifier) nas Views
  uuid: ^4.5.1              # ids locais de plantas, registros e mensagens
  intl: ^0.20.2             # datas e textos em pt-BR

  # --- Fase 2: persistência local / offline ---
  # shared_preferences: ^2.3.3    # preferências e contador diário de mensagens do chat
  # sqflite: ^2.4.1               # (ou isar/drift) catálogo de espécies e diário offline
  # path_provider: ^2.1.5

  # --- Fase 3: notificações locais (lembretes de rega/adubação) ---
  # flutter_local_notifications: ^18.0.1
  # timezone: ^0.10.0
  # flutter_timezone: ^3.0.1

  # --- Fase 4: Firebase + IA (Gemini via Cloud Functions) ---
  # firebase_core: ^3.8.1
  # firebase_auth: ^5.3.4
  # cloud_firestore: ^5.6.0
  # cloud_functions: ^5.2.0
  # firebase_storage: ^12.4.0     # upload das fotos enviadas no chat
  # image_picker: ^1.1.2
  # flutter_markdown: ^0.7.4      # respostas da IA

  # --- Fase 5: monetização ---
  # google_mobile_ads: ^5.3.0     # AdMob (anúncios discretos no plano free)
  # purchases_flutter: ^8.2.0     # assinatura/lifetime (RevenueCat) ou in_app_purchase

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
